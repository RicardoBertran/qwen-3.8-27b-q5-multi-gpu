version = 1

[qwen3.8-27b-Q5-MULTIGPU-MTP]
; Sustituye el placeholder por la ruta real al GGUF Q5 con pesos MTP.
m = <RUTA_AL_MODELO_GGUF_Q5>

jinja = true
fit = on
parallel = 1
batch-size = 128
ctx-size = 131072
n-predict = 8192

n-gpu-layers = all
split-mode = layer
; Orden esperado: RTX 5070 12 GB, RTX 5060 Ti 16 GB.
tensor-split = 12,16

reasoning = off
frequency-penalty = 0
presence-penalty = 0
repeat-penalty = 1
min-p = 0
temp = 0
top-k = 20
top-p = 0.95

spec-type = draft-mtp
spec-draft-n-max = 3
